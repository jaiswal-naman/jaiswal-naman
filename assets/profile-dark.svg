<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Naman Jaiswal — AI Engineer</title>
  <desc id="desc">From models to working products. Agents, voice AI, and observability. Animated signals connect context, an agent, tools, and traces.</desc>
